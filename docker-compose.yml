version: "3.8"

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=UTC
    ports:
      - "8191:8191"
    restart: unless-stopped

  luffytv-api:
    build: .
    container_name: luffytv-api
    environment:
      - PORT=3000
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - CACHE_TTL=3600000
      - ANIMEPAHE_BASE=https://animepahe.com
    ports:
      - "3000:3000"
    depends_on:
      - flaresolverr
    restart: unless-stopped
